<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisPass | Next-Gen Password Shield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <main class="app-container">
        <header class="app-header">
            <span class="badge">AegisPass Security</span>
            <h1>Cryptographic Key Generator</h1>
            <p>Generate high-entropy client-side passwords protected by web encryption standards.</p>
        </header>

        <section class="display-box">
            <input type="text" id="passwordDisplay" readonly placeholder="Click Generate" aria-label="Generated Password">
            <button id="copyBtn" class="copy-btn">
                <span id="copyText">Copy</span>
            </button>
        </section>

        <section class="strength-box">
            <div class="strength-label">
                <span>Entropy Score</span>
                <span id="strengthText">Waiting...</span>
            </div>
            <div class="strength-bar-track">
                <div id="strengthBar" class="strength-bar-fill"></div>
            </div>
        </section>

        <section class="controls-box">
            <div class="control-group">
                <div class="label-row">
                    <label for="lengthSlider">Character Length</label>
                    <span id="lengthVal" class="length-val">16</span>
                </div>
                <input type="range" id="lengthSlider" min="8" max="64" value="16">
            </div>

            <div class="options-grid">
                <label class="checkbox-container">
                    <input type="checkbox" id="incUppercase" checked>
                    <span class="checkmark"></span>
                    Uppercase (A-Z)
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="incLowercase" checked>
                    <span class="checkmark"></span>
                    Lowercase (a-z)
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="incNumbers" checked>
                    <span class="checkmark"></span>
                    Numbers (0-9)
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="incSymbols" checked>
                    <span class="checkmark"></span>
                    Symbols (!@#$)
                </label>
            </div>

            <button id="generateBtn" class="generate-btn">Generate Security Key</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
